<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenEASD Event Stream - Real-time Scan Monitoring</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a1a;
            color: #e0e0e0;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            color: #4CAF50;
            margin-bottom: 20px;
        }

        .controls {
            background: #2a2a2a;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .control-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #aaa;
        }

        input, select, button {
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #444;
            background: #333;
            color: #e0e0e0;
            width: 100%;
            font-size: 14px;
        }

        button {
            background: #4CAF50;
            color: white;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover:not(:disabled) {
            background: #45a049;
        }

        button:disabled {
            background: #666;
            cursor: not-allowed;
        }

        .status {
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .status.connected {
            background: #1b5e20;
            color: #81c784;
        }

        .status.disconnected {
            background: #b71c1c;
            color: #ef5350;
        }

        .events {
            background: #2a2a2a;
            padding: 20px;
            border-radius: 8px;
            max-height: 600px;
            overflow-y: auto;
        }

        .event {
            background: #333;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 4px;
            border-left: 4px solid #666;
            font-family: 'Courier New', monospace;
            font-size: 13px;
        }

        .event.scan { border-left-color: #2196F3; }
        .event.tool { border-left-color: #FFC107; }
        .event.finding { border-left-color: #F44336; }
        .event.analysis { border-left-color: #9C27B0; }

        .event-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            padding-bottom: 8px;
            border-bottom: 1px solid #444;
        }

        .event-type {
            font-weight: bold;
            color: #4CAF50;
        }

        .timestamp {
            color: #aaa;
            font-size: 11px;
        }

        .event-details {
            color: #ccc;
        }

        .event-detail {
            margin: 4px 0;
        }

        .severity-critical { color: #f44336; font-weight: bold; }
        .severity-high { color: #ff9800; font-weight: bold; }
        .severity-medium { color: #ffeb3b; }
        .severity-low { color: #2196f3; }
        .severity-info { color: #9e9e9e; }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: #2a2a2a;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-value {
            font-size: 32px;
            font-weight: bold;
            color: #4CAF50;
        }

        .stat-label {
            color: #aaa;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 OpenEASD Real-Time Event Monitor</h1>

        <div class="controls">
            <div class="control-group">
                <label for="wsUrl">WebSocket URL:</label>
                <input type="text" id="wsUrl" value="ws://localhost:8000/api/v1/events?topics=scan.*,tool.*,finding.*,analysis.*">
            </div>

            <div class="control-group">
                <button id="connectBtn" onclick="connect()">Connect</button>
            </div>

            <div id="status" class="status disconnected">⚫ Disconnected</div>
        </div>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-value" id="totalEvents">0</div>
                <div class="stat-label">Total Events</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="scansActive">0</div>
                <div class="stat-label">Active Scans</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="findingsTotal">0</div>
                <div class="stat-label">Findings</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="eventsPerMin">0</div>
                <div class="stat-label">Events/Min</div>
            </div>
        </div>

        <div class="events" id="events">
            <div style="color: #666; text-align: center; padding: 40px;">
                Click "Connect" to start receiving events...
            </div>
        </div>
    </div>

    <script>
        let ws = null;
        let stats = {
            totalEvents: 0,
            activeScans: new Set(),
            findings: 0,
            eventsInLastMinute: [],
        };

        function connect() {
            const url = document.getElementById('wsUrl').value;
            const connectBtn = document.getElementById('connectBtn');
            const statusDiv = document.getElementById('status');
            const eventsDiv = document.getElementById('events');

            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.close();
                connectBtn.textContent = 'Connect';
                statusDiv.className = 'status disconnected';
                statusDiv.textContent = '⚫ Disconnected';
                return;
            }

            ws = new WebSocket(url);

            ws.onopen = () => {
                connectBtn.textContent = 'Disconnect';
                statusDiv.className = 'status connected';
                statusDiv.textContent = '🟢 Connected';
                eventsDiv.innerHTML = '<div style="color: #4CAF50; text-align: center; padding: 20px;">Connected! Waiting for events...</div>';
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);

                if (data.type === 'connected') {
                    console.log('WebSocket connected:', data);
                    return;
                }

                handleEvent(data);
            };

            ws.onerror = (error) => {
                console.error('WebSocket error:', error);
                statusDiv.className = 'status disconnected';
                statusDiv.textContent = '🔴 Error - Check console';
            };

            ws.onclose = () => {
                connectBtn.textContent = 'Connect';
                statusDiv.className = 'status disconnected';
                statusDiv.textContent = '⚫ Disconnected';
            };

            // Send ping every 30 seconds
            setInterval(() => {
                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({ type: 'ping' }));
                }
            }, 30000);
        }

        function handleEvent(event) {
            const eventsDiv = document.getElementById('events');

            // Clear placeholder message
            if (eventsDiv.children[0]?.textContent.includes('Waiting for events')) {
                eventsDiv.innerHTML = '';
            }

            // Update stats
            stats.totalEvents++;
            stats.eventsInLastMinute.push(Date.now());
            stats.eventsInLastMinute = stats.eventsInLastMinute.filter(t => Date.now() - t < 60000);

            if (event.event_type === 'scan.started') {
                stats.activeScans.add(event.scan_id);
            } else if (event.event_type === 'scan.completed' || event.event_type === 'scan.failed') {
                stats.activeScans.delete(event.scan_id);
            } else if (event.event_type === 'finding.discovered') {
                stats.findings++;
            }

            updateStats();

            // Create event element
            const eventDiv = document.createElement('div');
            eventDiv.className = `event ${getEventCategory(event.event_type)}`;

            const header = document.createElement('div');
            header.className = 'event-header';

            const typeSpan = document.createElement('span');
            typeSpan.className = 'event-type';
            typeSpan.textContent = event.event_type;

            const timestampSpan = document.createElement('span');
            timestampSpan.className = 'timestamp';
            timestampSpan.textContent = new Date(event.timestamp).toLocaleTimeString();

            header.appendChild(typeSpan);
            header.appendChild(timestampSpan);

            const details = document.createElement('div');
            details.className = 'event-details';
            details.innerHTML = formatEventDetails(event);

            eventDiv.appendChild(header);
            eventDiv.appendChild(details);

            // Add to top of events
            eventsDiv.insertBefore(eventDiv, eventsDiv.firstChild);

            // Limit to 100 events
            while (eventsDiv.children.length > 100) {
                eventsDiv.removeChild(eventsDiv.lastChild);
            }
        }

        function getEventCategory(eventType) {
            if (eventType.startsWith('scan.')) return 'scan';
            if (eventType.startsWith('tool.')) return 'tool';
            if (eventType.startsWith('finding.')) return 'finding';
            if (eventType.startsWith('analysis.')) return 'analysis';
            return '';
        }

        function formatEventDetails(event) {
            let details = [];

            if (event.scan_id) details.push(`Scan ID: ${event.scan_id.substring(0, 8)}...`);
            if (event.domain) details.push(`Domain: ${event.domain}`);
            if (event.tool_name) details.push(`Tool: ${event.tool_name}`);
            if (event.results_count !== undefined) details.push(`Results: ${event.results_count}`);
            if (event.duration_seconds !== undefined) details.push(`Duration: ${event.duration_seconds.toFixed(2)}s`);
            if (event.findings_count !== undefined) details.push(`Findings: ${event.findings_count}`);

            if (event.finding_type) {
                const severity = event.severity || 'info';
                details.push(`<span class="severity-${severity}">${severity.toUpperCase()}</span> - ${event.finding_type}`);
                if (event.affected_asset) details.push(`Asset: ${event.affected_asset}`);
                if (event.risk_score !== undefined) details.push(`Risk: ${event.risk_score}/100`);
                if (event.port) details.push(`Port: ${event.port}/${event.protocol || 'tcp'}`);
            }

            if (event.error) details.push(`❌ Error: ${event.error}`);

            return details.map(d => `<div class="event-detail">${d}</div>`).join('');
        }

        function updateStats() {
            document.getElementById('totalEvents').textContent = stats.totalEvents;
            document.getElementById('scansActive').textContent = stats.activeScans.size;
            document.getElementById('findingsTotal').textContent = stats.findings;
            document.getElementById('eventsPerMin').textContent = stats.eventsInLastMinute.length;
        }

        // Auto-update events/min
        setInterval(updateStats, 1000);
    </script>
</body>
</html>
