# Alembic Configuration for OpenEASD
#
# This file is used by Alembic for database migrations.
# For more information see: https://alembic.sqlalchemy.org/

[alembic]
# Path to migration scripts
script_location = alembic

# Database URL - uses SQLite by default, can be overridden via environment
# The env.py file will read from config if OPENEASD_DATABASE_URL is not set
sqlalchemy.url = sqlite:///data/openeasd.db

# Template used to generate migration scripts
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(rev)s_%%(slug)s

# Truncate slug to this length
truncate_slug_length = 40

# Set to 'true' to run migrations offline (without database connection)
# offline_mode = false

# Max length of characters to apply to the "revision" column
# revision_environment = false

# set to 'true' to use an arbitrary start version
# sourceless = false

# version table name - default is 'alembic_version'
# version_table = alembic_version

# version_table_schema = %(schema)s

# version path separator - default is 'os'
# version_path_separator = os

# prepend_sys_path - multiple paths can be specified, separated by os.pathsep
prepend_sys_path = .

# timezone to use when rendering the date
# time_zone = UTC

# output_encoding = utf-8

[post_write_hooks]
# hook for running black after generating migrations
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -q

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
