[pytest]
# Test discovery
pythonpath = .
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output settings
addopts =
    -v
    --tb=short
    --strict-markers
    -ra

# Logging configuration
log_cli = true
log_cli_level = WARNING
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Test markers
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (may require database)
    slow: Slow running tests
    api: API endpoint tests
    database: Database layer tests
    messaging: Messaging layer tests (ZeroMQ)
    tools: Security tool runner tests
    analysis: Analysis layer tests

# Warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Timeout for individual tests (requires pytest-timeout)
# timeout = 60

# Minimum coverage threshold (requires pytest-cov)
# Enable with: pytest --cov=src --cov-report=html --cov-fail-under=70
